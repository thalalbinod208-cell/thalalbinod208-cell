<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-labelledby="title desc">
  <title id="title">Binod Thalal — Android Audio &amp; Systems Developer</title>
  <desc id="desc">Luxury obsidian and cyan audio-inspired banner with liquid glass card and audio frequency spectrum.</desc>
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060911"/>
      <stop offset="45%" stop-color="#0a1224"/>
      <stop offset="100%" stop-color="#050810"/>
    </linearGradient>

    <!-- Glowing Accents -->
    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#2dd4bf"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>

    <linearGradient id="glassFill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>

    <linearGradient id="cardGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.6"/>
    </linearGradient>

    <!-- Blurs for atmosphere -->
    <filter id="glowBlur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="60"/>
    </filter>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="24"/>
    </filter>
  </defs>

  <!-- Base Canvas -->
  <rect width="1200" height="380" rx="28" fill="url(#bg)"/>

  <!-- Atmospheric Glow Orbs -->
  <circle cx="200" cy="80" r="140" fill="#0284c7" opacity="0.18" filter="url(#glowBlur)"/>
  <circle cx="980" cy="120" r="180" fill="#6366f1" opacity="0.22" filter="url(#glowBlur)"/>
  <circle cx="680" cy="320" r="130" fill="#14b8a6" opacity="0.15" filter="url(#glowBlur)"/>

  <!-- Decorative Outer Glass Frame -->
  <rect x="20" y="20" width="1160" height="340" rx="24" fill="url(#glassFill)" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1.5"/>

  <!-- Cross of Light / Sparkle Icon -->
  <g transform="translate(64, 62)">
    <circle cx="16" cy="16" r="16" fill="url(#cyanGlow)" opacity="0.15"/>
    <path d="M16 4v24M4 16h24" stroke="url(#cyanGlow)" stroke-width="3.5" stroke-linecap="round"/>
    <circle cx="16" cy="16" r="3" fill="#ffffff"/>
  </g>

  <!-- Overline Badge -->
  <text x="110" y="82" fill="#7dd3fc" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,sans-serif" font-size="13" font-weight="700" letter-spacing="3.5">ANDROID ARCHITECTURE • BIT-PERFECT AUDIO • OPEN SOURCE</text>

  <!-- Hero Name -->
  <text x="64" y="165" fill="#f8fafc" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,sans-serif" font-size="56" font-weight="800" letter-spacing="-1.5">BINOD THALAL</text>

  <!-- Strapline -->
  <text x="66" y="210" fill="#94a3b8" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,sans-serif" font-size="20" font-weight="400">
    Crafting luxury Android audio experiences with Liquid Glass UI and high-fidelity acoustics.
  </text>

  <!-- Project Badges Row -->
  <g transform="translate(64, 245)">
    <!-- Aether Pill -->
    <rect x="0" y="0" width="180" height="40" rx="20" fill="#0284c7" fill-opacity="0.18" stroke="#38bdf8" stroke-opacity="0.45" stroke-width="1.2"/>
    <circle cx="20" cy="20" r="5" fill="#38bdf8"/>
    <text x="34" y="25" fill="#e0f2fe" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="13" font-weight="700" letter-spacing="0.5">AETHER MUSIC</text>

    <!-- UnX Music Pill -->
    <rect x="195" y="0" width="165" height="40" rx="20" fill="#6366f1" fill-opacity="0.16" stroke="#818cf8" stroke-opacity="0.4" stroke-width="1.2"/>
    <circle cx="215" cy="20" r="5" fill="#818cf8"/>
    <text x="229" y="25" fill="#ede9fe" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="13" font-weight="700" letter-spacing="0.5">UNX MUSIC</text>

    <!-- Stack Pill -->
    <rect x="375" y="0" width="195" height="40" rx="20" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.18" stroke-width="1.2"/>
    <text x="395" y="25" fill="#cbd5e1" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="13" font-weight="600" letter-spacing="0.4">KOTLIN • COMPOSE • MEDIA3</text>
  </g>

  <!-- Stats Line -->
  <text x="66" y="325" fill="#64748b" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="13" font-weight="500">
    ✦ Flagship Release: AETHER v2.4.0 (Live on Vercel &amp; GitHub) &nbsp;·&nbsp; Android 10+
  </text>

  <!-- Right Hero Card: Audio Spectrum & Status -->
  <g transform="translate(770, 68)">
    <!-- Glass Pod Background -->
    <rect x="0" y="0" width="360" height="244" rx="24" fill="#0b1329" fill-opacity="0.7" stroke="url(#cardGlow)" stroke-width="1.5"/>

    <!-- Mini Header -->
    <circle cx="34" cy="38" r="14" fill="#38bdf8" fill-opacity="0.2"/>
    <path d="M30 31v14l11-7z" fill="#38bdf8"/>
    <text x="58" y="36" fill="#f1f5f9" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="15" font-weight="700">NOW STREAMING</text>
    <text x="58" y="52" fill="#64748b" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="11" font-weight="600" letter-spacing="1">BIT-PERFECT HI-RES AUDIO</text>

    <!-- Live Indicator Pill -->
    <rect x="272" y="26" width="62" height="24" rx="12" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-opacity="0.4"/>
    <circle cx="284" cy="38" r="3.5" fill="#10b981"/>
    <text x="293" y="42" fill="#34d399" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="10" font-weight="700" letter-spacing="1">ACTIVE</text>

    <!-- Equalizer Spectrum Bars -->
    <g transform="translate(34, 155)">
      <!-- Animated Waveform Heights -->
      <rect x="0" y="-30" width="7" height="40" rx="3.5" fill="url(#cyanGlow)" opacity="0.6"/>
      <rect x="13" y="-55" width="7" height="65" rx="3.5" fill="url(#cyanGlow)" opacity="0.85"/>
      <rect x="26" y="-75" width="7" height="85" rx="3.5" fill="url(#cyanGlow)"/>
      <rect x="39" y="-45" width="7" height="55" rx="3.5" fill="url(#cyanGlow)" opacity="0.75"/>
      <rect x="52" y="-90" width="7" height="100" rx="3.5" fill="url(#cyanGlow)"/>
      <rect x="65" y="-60" width="7" height="70" rx="3.5" fill="url(#cyanGlow)" opacity="0.9"/>
      <rect x="78" y="-105" width="7" height="115" rx="3.5" fill="url(#cyanGlow)"/>
      <rect x="91" y="-80" width="7" height="90" rx="3.5" fill="url(#cyanGlow)" opacity="0.95"/>
      <rect x="104" y="-50" width="7" height="60" rx="3.5" fill="url(#cyanGlow)" opacity="0.8"/>
      <rect x="117" y="-95" width="7" height="105" rx="3.5" fill="url(#cyanGlow)"/>
      <rect x="130" y="-70" width="7" height="80" rx="3.5" fill="url(#cyanGlow)" opacity="0.9"/>
      <rect x="143" y="-110" width="7" height="120" rx="3.5" fill="url(#cyanGlow)"/>
      <rect x="156" y="-85" width="7" height="95" rx="3.5" fill="url(#cyanGlow)" opacity="0.95"/>
      <rect x="169" y="-60" width="7" height="70" rx="3.5" fill="url(#cyanGlow)" opacity="0.85"/>
      <rect x="182" y="-100" width="7" height="110" rx="3.5" fill="url(#cyanGlow)"/>
      <rect x="195" y="-40" width="7" height="50" rx="3.5" fill="url(#cyanGlow)" opacity="0.7"/>
      <rect x="208" y="-75" width="7" height="85" rx="3.5" fill="url(#cyanGlow)" opacity="0.9"/>
      <rect x="221" y="-90" width="7" height="100" rx="3.5" fill="url(#cyanGlow)"/>
      <rect x="234" y="-55" width="7" height="65" rx="3.5" fill="url(#cyanGlow)" opacity="0.8"/>
      <rect x="247" y="-70" width="7" height="80" rx="3.5" fill="url(#cyanGlow)" opacity="0.85"/>
      <rect x="260" y="-45" width="7" height="55" rx="3.5" fill="url(#cyanGlow)" opacity="0.65"/>
      <rect x="273" y="-30" width="7" height="40" rx="3.5" fill="url(#cyanGlow)" opacity="0.5"/>
    </g>

    <!-- Spectrum Baseline Line -->
    <line x1="34" y1="168" x2="320" y2="168" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1"/>

    <!-- Track Info In Pod -->
    <text x="34" y="200" fill="#f8fafc" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="14" font-weight="700">AETHER Engine</text>
    <text x="34" y="218" fill="#94a3b8" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="11">4K Video • Media3 • Liquid Glass Design</text>
    <text x="320" y="210" text-anchor="end" fill="#38bdf8" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="11" font-weight="700">2.4.0</text>
  </g>
</svg>
